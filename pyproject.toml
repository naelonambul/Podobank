[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "podobank-api"
version = "0.1.0"
description = "FastAPI backend for the PodoBank portfolio project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "PyMySQL>=1.1,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "ruff==0.17.3",
]

[project.scripts]
podobank-api = "podobank_api.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["podobank_api*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
