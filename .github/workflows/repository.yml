# Repository gate. No path filters: every job always runs to a terminal result,
# and routing / not-applicable decisions happen inside scripts/repo.py.
name: repository

on:
  pull_request:
    # `edited` re-runs routing when the PR body's Change-ID changes.
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One live run per PR; a superseded (cancelled) run never qualifies.
  # Pushes to main are grouped per commit so every merged tree gets a full run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # PR: routed against the PR base, identified by the PR body's Change-ID.
  # main: full suite, no active change. Branch-name inference is off in CI.
  REPO_ARGS: >-
    --ci --branch=
    ${{ github.event_name == 'pull_request' && format('--pr-body /tmp/pr-body.md --base {0} --head HEAD', github.event.pull_request.base.sha) || '' }}
  VERIFY_ARGS: ${{ github.event_name == 'push' && '--full' || '' }}

jobs:
  control-plane-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s scripts/tests -t . -v

  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # PR base and first-parent closure anchors need full history
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
      - run: python3 scripts/repo.py status $REPO_ARGS

  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
      - run: python3 scripts/repo.py verify --group core $VERIFY_ARGS $REPO_ARGS
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-core
          path: .evidence/
          include-hidden-files: true
          if-no-files-found: ignore

  verify-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://podobank:podobank-test@127.0.0.1:3306/podobank_test
    services:
      mariadb:
        image: mariadb:11.8.9
        command: --sql-mode=ORACLE,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
        env:
          MARIADB_DATABASE: podobank_test
          MARIADB_USER: podobank
          MARIADB_PASSWORD: podobank-test
          MARIADB_ROOT_PASSWORD: podobank-root-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
      - run: python3 scripts/repo.py verify --group mariadb $VERIFY_ARGS $REPO_ARGS
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-mariadb
          path: .evidence/
          include-hidden-files: true
          if-no-files-found: ignore

  # The one status check to require. Every job above must end in success;
  # skipped, cancelled, or failed jobs all fail the summary.
  summary:
    if: always()
    needs: [control-plane-tests, status, verify-core, verify-mariadb]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for job, v in needs.items():
              print(f"{job}: {v['result']}")
          sys.exit(0 if needs and all(v["result"] == "success" for v in needs.values()) else 1)
          PY
