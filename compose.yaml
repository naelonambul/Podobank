services:
  api:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: sqlite:////var/lib/podobank/podobank.db
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - podobank_data:/var/lib/podobank
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  podobank_data:
