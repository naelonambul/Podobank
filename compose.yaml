services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${PODOBANK_DB_NAME:-podobank}
      MARIADB_USER: ${PODOBANK_DB_USER:-podobank}
      MARIADB_PASSWORD: ${PODOBANK_DB_PASSWORD:?Set PODOBANK_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${PODOBANK_DB_ROOT_PASSWORD:?Set PODOBANK_DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PODOBANK_DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mariadb-data:
