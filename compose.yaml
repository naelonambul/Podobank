services:
  db:
    image: mariadb:11.8.9
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-podobank_dev}
      MARIADB_USER: ${MARIADB_USER:-podobank}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in the local .env file}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mariadb_data:
