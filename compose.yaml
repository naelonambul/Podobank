services:
  api:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: sqlite:////var/lib/podobank/podobank.db
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-change-before-production}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      STAFF_INITIAL_PHONE: ${STAFF_INITIAL_PHONE:-01099990000}
      STAFF_INITIAL_PASSWORD: ${STAFF_INITIAL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - podobank_data:/var/lib/podobank
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  repayment-worker:
    build:
      context: .
    command: ["podobank-api", "run-repayment-worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: sqlite:////var/lib/podobank/podobank.db
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-change-before-production}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      STAFF_INITIAL_PHONE: ${STAFF_INITIAL_PHONE:-01099990000}
      STAFF_INITIAL_PASSWORD: ${STAFF_INITIAL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - podobank_data:/var/lib/podobank
    depends_on:
      api:
        condition: service_healthy

volumes:
  podobank_data:
